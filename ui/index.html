<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalTranscribe</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18322f;background:#f5f7f4;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #d7e1db;background:#fff;color:#21453d;border-radius:9px;padding:10px 15px;font-weight:600}button:hover{background:#edf3ef}button:disabled{opacity:.4;cursor:default}button.primary{background:#176b52;color:white;border-color:#176b52}button.primary:hover{background:#105641}.top{height:72px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e1e8e0;background:#fff}.brand{display:flex;gap:12px;align-items:center;font-size:19px;font-weight:700;letter-spacing:-.5px}.mark{display:flex;align-items:center;gap:3px;background:#176b52;padding:9px;border-radius:10px;height:36px}.mark i{display:block;width:3px;background:#d7eee0;border-radius:2px;height:10px}.mark i:nth-child(2){height:20px}.mark i:nth-child(3){height:15px}.badge{font-size:11px;background:#eaf3eb;color:#34654a;padding:6px 10px;border-radius:20px;font-weight:600}main{max-width:1060px;margin:auto;padding:28px 32px}h1{font-size:29px;font-weight:700;letter-spacing:-1px;margin:0 0 8px}p{color:#64756c;line-height:1.6;margin:0}.intro{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.actions{display:flex;gap:8px;white-space:nowrap}.panel{border:1px solid #dae3db;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 3px 15px #193f2910}.toolbar{padding:17px 20px;display:flex;justify-content:space-between;align-items:center;background:#fcfdfb;border-bottom:1px solid #e3e9e1}.toolbar label{display:flex;gap:9px;align-items:center;color:#66786d;font-size:12px}input[type=checkbox]{accent-color:#176b52;width:17px;height:17px;cursor:pointer}.summary{font-size:12px;color:#6a7b71}.empty{padding:54px;text-align:center;color:#64756c}.job{padding:17px 20px;border-bottom:1px solid #e9eee7;display:flex;align-items:center;gap:14px}.job:last-child{border-bottom:0}.job.selected{background:#f2f8f3}.fileicon{font-size:14px;border:1px solid #dde7dd;border-radius:8px;background:#f5f8f2;width:36px;height:42px;display:flex;align-items:center;justify-content:center;color:#45836a}.detail{min-width:0;flex:1}.name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:660px}.meta{margin-top:5px;font-size:11px;color:#829086}.status{font-size:11px;border-radius:20px;padding:5px 9px;background:#f0f3ee;color:#6b786d;white-space:nowrap}.status.Complete{background:#e4f3e7;color:#28653e}.status.Transcribing{background:#e5f1fc;color:#2f698e}.status.Failed{background:#fff0ec;color:#a6513a}.progress{height:4px;border-radius:3px;background:#e8efe7;margin-top:9px;overflow:hidden}.progress i{height:100%;display:block;background:#3d9272}.error{font-size:11px;color:#aa5138;margin-top:7px}.iconbutton{border:0;padding:7px;background:transparent;color:#8b978c}.job .open{font-size:11px;padding:7px 9px}.bottom{margin-top:19px;display:flex;justify-content:space-between;gap:20px;align-items:center}.output{min-width:0}.output small{display:block;font-size:10px;font-weight:700;color:#819081;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.path{font-size:11px;color:#64756c;max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.link{border:0;padding:0;background:transparent;color:#176b52;font-size:11px;margin-top:6px}.runactions{display:flex;gap:9px}.note{font-size:11px;margin-top:20px;color:#7e8d80}.toast{display:none;margin:0 0 15px;padding:12px;border:1px solid #ead3be;background:#fff8ef;border-radius:8px;color:#965d2c;font-size:12px}.manual{display:flex;gap:8px;margin-top:16px}.manual input{flex:1;border:1px solid #dce5db;border-radius:8px;padding:10px 12px;min-width:0;background:white}.manual[hidden]{display:none}@media(max-width:700px){main{padding:20px}.intro{display:block}.actions{margin-top:15px}.top{padding:0 20px}.bottom{align-items:flex-start;flex-direction:column}.name{max-width:320px}.job{padding:15px}.fileicon{display:none}}
.bottom{position:fixed;bottom:0;left:0;right:0;margin:0;padding:18px 32px;background:#fff;border-top:1px solid #dce5db;z-index:10}main{padding-bottom:130px}.note{margin-bottom:12px}
.phase{font-size:12px;font-weight:500;color:#3f5d52;margin-top:10px}.timing{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:5px;font-size:12px;color:#3f5d52;font-variant-numeric:tabular-nums}.saved{color:#536b60}.run-panel{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:55%}.batch-status{font-size:12px;color:#3f5d52;text-align:right;font-variant-numeric:tabular-nums}.progress{height:5px}.phase[hidden],.timing[hidden],.progress[hidden],.open[hidden],.error[hidden],.batch-status[hidden]{display:none}button:focus-visible,input:focus-visible{outline:2px solid #176b52;outline-offset:3px}main{padding-bottom:170px}@media(max-width:820px){.run-panel{max-width:50%}.batch-status{max-width:280px}}@media(max-width:700px){.run-panel{max-width:100%;align-items:flex-start}.batch-status{text-align:left}main{padding-bottom:220px}}
</style></head><body>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>LocalTranscribe</div><span class="badge">NONCOMMERCIAL · LOCAL</span></header>
<main><section class="intro"><div><h1>Turn recordings into text.</h1><p>Select your files and start when you’re ready.</p></div><div class="actions"><button id="addFiles">＋ Add files</button><button id="addFolder">Add folder</button></div></section>
<div id="toast" class="toast" role="alert"></div>
<section class="panel" aria-label="Recordings"><div class="toolbar"><label><input id="selectAll" type="checkbox">Select all</label><span class="summary" id="summary"></span></div><div id="jobs"></div></section>
<div class="bottom"><div class="output"><small>Save transcripts to</small><div id="outputPath" class="path"></div><button class="link" id="changeOutput">Choose folder</button></div><div class="run-panel"><div id="batchStatus" class="batch-status" hidden></div><div class="runactions"><button id="stop" hidden>Stop</button><button id="start" class="primary" disabled>Transcribe selected</button></div></div></div>
<p class="note">TXT, timestamped text, SRT and VTT. Processing starts only when you press Transcribe. Interrupted jobs can resume.</p>
<div class="manual" id="manual" hidden><input id="manualPath" aria-label="File or folder path" placeholder="Paste a file or folder path"><button id="manualAdd">Add path</button></div>
</main>
<script>
const token='__TOKEN__', selected=new Set(), rows=new Map();let state={jobs:[],active:false};
const phases={starting:'Starting…',checking_recording:'Checking recording…',checking_model:'Checking transcription model…',checking_saved_progress:'Checking saved progress…',loading_engine:'Loading transcription engine…',preparing_audio:'Preparing audio…',transcribing:'Transcribing…',saving_progress:'Saving progress…',finishing:'Finishing transcript…',stopping:'Stopping safely…'};
function notice(message){const el=document.getElementById('toast');el.textContent=message;el.style.display=message?'block':'none'}
async function api(route,body){const response=await fetch('/api/'+route,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-LocalTranscribe-Token':token},body:body===undefined?undefined:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||'Unable to complete action');return result}
function duration(seconds){const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60);return h?`${h}h ${m}m`:`${m}m`}
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function setText(el,value){if(el.textContent!==value)el.textContent=value}
function elapsed(seconds){const total=Math.max(0,Math.floor(seconds)),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;return h?`${h}h ${m}m ${s}s`:m?`${m}m ${s}s`:`${s}s`}
function remaining(seconds,total=false){if(!Number.isFinite(seconds))return total?'Estimating total time remaining…':'Estimating time remaining…';if(seconds<60)return total?'Less than a minute total remaining':'Less than a minute remaining';const minutes=Math.ceil(seconds/60),amount=minutes<60?`${minutes}m`:`${Math.floor(minutes/60)}h${minutes%60?' '+minutes%60+'m':''}`;return total?`About ${amount} total remaining`:`About ${amount} remaining`}
function createRow(job){
  const row=element('div','job'),check=element('input'),detail=element('div','detail'),name=element('div','name'),meta=element('div','meta'),phase=element('div','phase'),timing=element('div','timing'),eta=element('span'),spent=element('span'),saved=element('span','saved'),track=element('div','progress'),fill=element('i'),error=element('div','error'),status=element('span','status'),open=element('button','open','Open output'),remove=element('button','iconbutton','×');
  row.dataset.jobId=job.id;check.type='checkbox';check.onchange=()=>{check.checked?selected.add(job.id):selected.delete(job.id);render()};phase.setAttribute('role','status');phase.setAttribute('aria-live','polite');track.setAttribute('role','progressbar');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');track.append(fill);timing.append(eta,spent,saved);detail.append(name,meta,phase,timing,track,error);row.append(check,element('div','fileicon','▶'),detail,status,open,remove);open.onclick=()=>act('reveal',{id:job.id});remove.onclick=()=>{selected.delete(job.id);act('remove',{id:job.id})};
  return {row,check,name,meta,phase,timing,eta,spent,saved,track,fill,error,status,open,remove};
}
function updateRow(view,job){
  const active=job.status==='Transcribing',stopped=job.status==='Stopped',progress=Math.max(0,Math.min(active?99:100,Number.isFinite(job.live_progress)?job.live_progress:job.progress||0));
  view.row.className='job'+(selected.has(job.id)?' selected':'');view.check.checked=selected.has(job.id);view.check.disabled=state.active;view.check.setAttribute('aria-label','Select '+job.name);setText(view.name,job.name);view.name.title=job.name;setText(view.meta,duration(job.duration)+' · '+(job.bytes/1e9).toFixed(2)+' GB');
  view.phase.hidden=!active&&!stopped;setText(view.phase,active?(phases[job.phase]||phases.starting):stopped?'Ready to resume from saved progress':'');view.timing.hidden=!active&&!stopped;view.eta.hidden=!active||job.phase==='stopping'||job.phase==='finishing';setText(view.eta,remaining(job.eta_seconds));view.spent.hidden=!active;setText(view.spent,'Elapsed '+elapsed(job.elapsed_seconds||0));setText(view.saved,Math.floor(job.progress||0)+'% saved');
  view.track.hidden=!active&&!stopped;view.fill.style.width=progress+'%';view.track.setAttribute('aria-label','Progress for '+job.name);view.track.setAttribute('aria-valuenow',String(Math.floor(progress)));view.track.setAttribute('aria-valuetext',`${Math.floor(progress)}% progress, ${Math.floor(job.progress||0)}% audio saved`);view.error.hidden=!job.error;setText(view.error,job.error||'');view.status.className='status '+job.status;setText(view.status,active?(job.phase==='stopping'?'Stopping':Math.floor(progress)+'%'):job.status);view.open.hidden=job.status!=='Complete';view.remove.disabled=state.active;view.remove.setAttribute('aria-label','Remove '+job.name);
}
function render(){
  const list=document.getElementById('jobs'),ids=new Set(state.jobs.map(job=>job.id));for(const [id,view] of rows){if(!ids.has(id)){view.row.remove();rows.delete(id);selected.delete(id)}}
  if(state.jobs.length){list.querySelector('.empty')?.remove();state.jobs.forEach((job,index)=>{let view=rows.get(job.id);if(!view){view=createRow(job);rows.set(job.id,view)}updateRow(view,job);if(list.children[index]!==view.row)list.insertBefore(view.row,list.children[index]||null)})}else if(!list.querySelector('.empty'))list.append(element('div','empty','Add recordings to get started. Large videos are read directly from disk.'));
  const count=state.jobs.length;setText(document.getElementById('summary'),`${count} recording${count===1?'':'s'} · ${duration(state.jobs.reduce((n,j)=>n+j.duration,0))}`);setText(document.getElementById('outputPath'),state.output||'');document.getElementById('selectAll').checked=count>0&&selected.size===count;document.getElementById('selectAll').disabled=state.active;document.getElementById('start').disabled=state.active||!selected.size;setText(document.getElementById('start'),selected.size?`Transcribe ${selected.size} selected`:'Transcribe selected');const stop=document.getElementById('stop');stop.hidden=!state.active;stop.disabled=Boolean(state.batch?.stopping);setText(stop,state.batch?.stopping?'Stopping…':'Stop');document.getElementById('changeOutput').disabled=state.active;
  const batch=document.getElementById('batchStatus'),finishing=state.jobs.some(job=>job.status==='Transcribing'&&job.phase==='finishing');batch.hidden=!state.active||!state.batch;setText(batch,state.batch?(state.batch.stopping?'Stopping… Completed checkpoints will be kept.':`Recording ${state.batch.index} of ${state.batch.count} · ${finishing?'Finishing current recording…':remaining(state.batch.eta_seconds,true)}`):'');
}
async function refresh(){try{const next=await api('state');if(JSON.stringify(next)!==JSON.stringify(state)){state=next;render()}}catch(error){notice(error.message)}}
async function act(route,body){try{notice('');state=await api(route,body);render()}catch(error){notice(error.message)}}
window.nativeFilesSelected=paths=>act('add',{paths});window.nativeOutputSelected=path=>act('output',{path});
function picker(mode){const bridge=window.webkit?.messageHandlers?.picker;if(bridge)bridge.postMessage({mode});else{document.getElementById('manual').hidden=false;document.getElementById('manualPath').focus();notice('Paste the local path below. No video upload is needed.')}}
document.getElementById('addFiles').onclick=()=>picker('files');document.getElementById('addFolder').onclick=()=>picker('folder');document.getElementById('changeOutput').onclick=()=>picker('output');
document.getElementById('manualAdd').onclick=()=>{const path=document.getElementById('manualPath').value.trim();if(path)window.nativeFilesSelected([path])};
document.getElementById('selectAll').onchange=event=>{selected.clear();if(event.target.checked)state.jobs.forEach(job=>selected.add(job.id));render()};
document.getElementById('start').onclick=async()=>{await act('start',{ids:[...selected]});selected.clear();render()};document.getElementById('stop').onclick=()=>act('stop',{});
window.addEventListener('dragover',event=>event.preventDefault());window.addEventListener('drop',event=>event.preventDefault());refresh();setInterval(refresh,1000);
</script></body></html>
